[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btp-vox"
version = "0.1.0"
description = "MagicaVoxel export, paint UV unwrapping, and glTF texture merging tools"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/eggbbq/magicavoxel_merge"

[project.scripts]
btp-vox = "btp_vox.cli:main"
btp-vox-repack = "btp_vox.repack:main"
btp-vox-merge-textures = "btp_vox.merge_textures:main"

[tool.setuptools]
packages = ["btp_vox"]
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
